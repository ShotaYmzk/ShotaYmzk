{name: Update profile stats, on: {schedule: [{cron: '0 3 * * *'}], workflow_dispatch: {}}, permissions: {contents: write}, jobs: {update-stats: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {name: Generate stats.svg, env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}, run: 'USER_NAME=ShotaYmzk; REPOS=$(gh api ''users/ShotaYmzk/repos?per_page=100'' --paginate --jq ''.[] | select(.fork == false) | [.stargazers_count, .language] | @tsv''); COUNT=$(printf ''%s\\n'' "$REPOS" | grep -c . || true); STARS=$(printf ''%s\\n'' "$REPOS" | awk -F''\\t'' ''{ s += $1 } END { print s + 0 }''); FOLLOWERS=$(gh api ''users/ShotaYmzk'' --jq .followers); LANGS=$(printf ''%s\\n'' "$REPOS" | awk -F''\\t'' ''$2 != "" { print $2 }'' | sort | uniq -c | sort -rn | head -5); { echo ''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">''; echo ''<rect width="495" height="195" rx="10" fill="#0d1117" stroke="#30363d"/>''; echo ''<text x="25" y="40" fill="#58a6ff" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="bold">ShotaYmzk GitHub Stats</text>''; printf ''<text x="25" y="80" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="16">Public repos: %s</text>\\n'' "$COUNT"; printf ''<text x="25" y="110" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="16">Total stars: %s</text>\\n'' "$STARS"; printf ''<text x="25" y="140" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="16">Followers: %s</text>\\n'' "$FOLLOWERS"; echo ''<text x="250" y="80" fill="#58a6ff" font-family="Segoe UI,Arial,sans-serif" font-size="16">Top languages</text>''; Y=110; while read -r C L; do printf ''<text x="250" y="%s" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="14">%s: %s repos</text>\\n'' "$Y" "$L" "$C"; Y=$((Y + 22)); done <<< "$LANGS"; echo ''</svg>''; } > stats.svg'}, {name: Commit if changed, run: 'git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add stats.svg; if ! git diff --staged --quiet; then git commit -m "Update stats.svg" && git push; fi'}]}}}
